<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Coop — Temperature Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
/* ============================================================
   ROOT TOKENS
   ============================================================ */
:root {
  --hay:        #F5C842;
  --straw:      #E8A020;
  --barn:       #C0392B;
  --barn-dk:    #922B21;
  --earth:      #8B5E3C;
  --soil:       #4A2508;
  --cream:      #FDF6E3;
  --egg:        #FFFBF0;
  --feather:    #F4A460;
  --sky:        #AED9E0;
  --good:       #27AE60;
  --warn:       #E67E22;
  --hot:        #E74C3C;
  --cold:       #2980B9;
  --text:       #2C1A0E;
  --text-soft:  #7A4A22;
  --card:       rgba(253,246,227,0.88);
  --border:     rgba(200,155,80,0.35);
  --shadow:     rgba(44,26,14,0.22);
}

body.dark {
  --cream:      #1A1208;
  --egg:        #201508;
  --card:       rgba(28,16,6,0.92);
  --border:     rgba(180,130,50,0.25);
  --text:       #F0DFB8;
  --text-soft:  #C09050;
  --shadow:     rgba(0,0,0,0.5);
}

/* ============================================================
   RESET & BASE
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--cream);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  transition: background 0.5s, color 0.5s;
}

/* ============================================================
   BACKGROUND SCENE
   ============================================================ */
.scene {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  background: linear-gradient(180deg,
    #74B8E0 0%,
    #A8D4EC 28%,
    #C5E4C0 52%,
    #7AAF62 64%,
    #5C8A40 72%,
    #4A3010 85%,
    #2E1A06 100%
  );
  transition: background 0.8s;
}
body.dark .scene {
  background: linear-gradient(180deg,
    #060C1A 0%,
    #0A1228 30%,
    #0C1A08 58%,
    #080E04 72%,
    #120800 88%,
    #080400 100%
  );
}

/* Sun */
.sun {
  position: absolute;
  top: 7%; right: 10%;
  width: 80px; height: 80px;
  background: radial-gradient(circle, #FFE566 35%, #FFC107 65%, transparent 100%);
  border-radius: 50%;
  box-shadow: 0 0 50px 18px rgba(255,220,50,0.4);
  animation: sunGlow 5s ease-in-out infinite;
  transition: opacity 0.8s;
}
body.dark .sun { opacity: 0; }
@keyframes sunGlow {
  0%,100% { box-shadow: 0 0 50px 18px rgba(255,220,50,0.4); }
  50%      { box-shadow: 0 0 70px 30px rgba(255,220,50,0.55); }
}

/* Moon */
.moon {
  position: absolute;
  top: 7%; right: 10%;
  width: 60px; height: 60px;
  background: radial-gradient(circle at 40% 40%, #F5EACC, #D4C080);
  border-radius: 50%;
  box-shadow: 0 0 30px 10px rgba(210,190,100,0.3), inset -8px -4px 0 rgba(0,0,0,0.12);
  opacity: 0;
  transition: opacity 0.8s;
}
body.dark .moon { opacity: 1; }

/* Stars */
.stars {
  position: absolute;
  inset: 0;
  opacity: 0;
  transition: opacity 0.8s;
}
body.dark .stars { opacity: 1; }
.star {
  position: absolute;
  background: white;
  border-radius: 50%;
  animation: twinkle var(--d,3s) ease-in-out infinite var(--delay,0s);
}
@keyframes twinkle {
  0%,100% { opacity: 0.9; transform: scale(1); }
  50%      { opacity: 0.2; transform: scale(0.6); }
}

/* Clouds */
.cloud {
  position: absolute;
  border-radius: 999px;
  background: rgba(255,255,255,0.78);
  filter: blur(3px);
  animation: cloudDrift var(--cd, 30s) linear infinite var(--cdelay,0s);
}
.cloud::before, .cloud::after {
  content: '';
  position: absolute;
  border-radius: 999px;
  background: inherit;
}
.c1 { top:9%; left:-20%; width:180px; height:44px; --cd:32s; }
.c1::before { width:90px; height:64px; top:-28px; left:28px; }
.c1::after  { width:70px; height:50px; top:-18px; left:80px; }
.c2 { top:16%; left:-25%; width:140px; height:36px; --cd:44s; --cdelay:10s; }
.c2::before { width:65px; height:52px; top:-22px; left:18px; }
.c3 { top:6%;  left:-20%; width:100px; height:30px; --cd:55s; --cdelay:20s; }
.c3::before { width:50px; height:44px; top:-18px; left:12px; }
body.dark .cloud { opacity: 0; }
@keyframes cloudDrift {
  from { transform: translateX(0); }
  to   { transform: translateX(130vw); }
}

/* Barn silhouette */
.barn {
  position: absolute;
  bottom: 18%;
  left: 0;
  opacity: 0.35;
  transition: opacity 0.5s;
}
body.dark .barn { opacity: 0.22; }

/* Grass strip */
.grass {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 20%;
  background: linear-gradient(180deg, #4A8C3A 0%, #336628 50%, #1E3D16 100%);
  border-radius: 80% 80% 0 0 / 40% 40% 0 0;
}
body.dark .grass { background: linear-gradient(180deg, #152210 0%, #0C1509 100%); }

/* ============================================================
   FLOATING FEATHERS
   ============================================================ */
.feathers { position: fixed; inset: 0; pointer-events: none; z-index: 6; overflow: hidden; }
.feather {
  position: absolute;
  top: -40px;
  font-size: 1rem;
  opacity: 0;
  animation: featherFall linear infinite;
}
@keyframes featherFall {
  0%   { opacity: 0;   transform: translateY(0) rotate(0deg) translateX(0); }
  8%   { opacity: 0.65; }
  88%  { opacity: 0.4; }
  100% { opacity: 0;   transform: translateY(105vh) rotate(540deg) translateX(50px); }
}

/* ============================================================
   PAGE WRAPPER
   ============================================================ */
.page {
  position: relative;
  z-index: 10;
  max-width: 960px;
  margin: 0 auto;
  padding: 32px 18px 70px;
}

/* ============================================================
   HEADER
   ============================================================ */
header {
  text-align: center;
  margin-bottom: 32px;
  animation: fadeUp 0.7s cubic-bezier(.16,1,.3,1) both;
}
.badge {
  display: inline-block;
  background: var(--barn);
  color: #FFE566;
  font-size: 0.62rem;
  font-weight: 700;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  padding: 4px 16px;
  border-radius: 999px;
  margin-bottom: 10px;
}
h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(2.4rem, 6.5vw, 4rem);
  font-weight: 900;
  color: var(--cream);
  text-shadow: 0 3px 20px rgba(0,0,0,0.35);
  line-height: 1.08;
  letter-spacing: -0.02em;
}
body.dark h1 { color: var(--hay); }
.tagline {
  color: rgba(253,246,227,0.65);
  font-size: 0.85rem;
  font-weight: 300;
  letter-spacing: 0.1em;
  margin-top: 6px;
}
body.dark .tagline { color: rgba(245,200,66,0.5); }

/* ============================================================
   GRID
   ============================================================ */
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}
.span2 { grid-column: 1 / -1; }
@media (max-width: 600px) {
  .grid { grid-template-columns: 1fr; }
  .span2 { grid-column: 1; }
}

/* ============================================================
   CARDS
   ============================================================ */
.card {
  background: var(--card);
  backdrop-filter: blur(22px) saturate(180%);
  -webkit-backdrop-filter: blur(22px) saturate(180%);
  border: 1px solid var(--border);
  border-radius: 22px;
  padding: 26px 24px;
  box-shadow: 0 6px 36px var(--shadow), 0 1px 0 rgba(255,255,255,0.55) inset;
  transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.5s, border-color 0.5s;
  position: relative;
  overflow: hidden;
  animation: fadeUp 0.65s cubic-bezier(.16,1,.3,1) both;
}
.card::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--hay), var(--straw), var(--feather));
  border-radius: 22px 22px 0 0;
  opacity: 0.9;
}
.card:hover {
  transform: translateY(-3px);
  box-shadow: 0 12px 44px var(--shadow), 0 1px 0 rgba(255,255,255,0.55) inset;
}
.card:nth-child(1) { animation-delay: 0.05s; }
.card:nth-child(2) { animation-delay: 0.12s; }
.card:nth-child(3) { animation-delay: 0.19s; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(28px); }
  to   { opacity: 1; transform: translateY(0); }
}

.card-label {
  font-size: 0.62rem;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--text-soft);
  margin-bottom: 14px;
}

/* ============================================================
   MAIN TEMP CARD
   ============================================================ */
.card-main {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 10px;
}

/* ── Chicken SVG ── */
.chicken-wrap {
  position: relative;
  width: 148px;
  height: 148px;
  margin: 4px 0 0;
}
.chicken-svg {
  width: 148px;
  height: 148px;
  filter: drop-shadow(0 6px 12px rgba(44,26,14,0.28));
}

/* State layers: only one visible at a time */
.cs { display: none; }
.cs.active { display: block; }

/* Animations per state */
.cs-normal  { animation: bob      2.6s ease-in-out infinite; }
.cs-hot     { animation: bobFast  1.1s ease-in-out infinite; }
.cs-cold    { animation: shiver   0.38s ease-in-out infinite; }
.cs-alert   { animation: bobFast  0.55s ease-in-out infinite; }

@keyframes bob     { 0%,100%{transform:translateY(0)}  50%{transform:translateY(-7px)} }
@keyframes bobFast { 0%,100%{transform:translateY(0) rotate(-2deg)} 50%{transform:translateY(-10px) rotate(2deg)} }
@keyframes shiver  { 0%,100%{transform:rotate(0deg)} 25%{transform:rotate(-4deg)} 75%{transform:rotate(4deg)} }

/* ── Temperature value ── */
.temp-val {
  font-family: 'Playfair Display', serif;
  font-size: clamp(3.2rem, 10vw, 5.2rem);
  font-weight: 900;
  line-height: 1;
  color: var(--text);
  letter-spacing: -0.03em;
  transition: color 0.5s;
}
.temp-val.t-good { color: var(--good); }
.temp-val.t-warn { color: var(--warn); }
.temp-val.t-hot  { color: var(--hot); }
.temp-val.t-cold { color: var(--cold); }

/* ── Status pill ── */
.pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 5px 16px;
  border-radius: 999px;
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  border: 1.5px solid;
  transition: all 0.45s;
}
.pill-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: currentColor;
  animation: blink 2s ease-in-out infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.25} }

.pill.good  { color: var(--good); border-color: rgba(39,174,96,0.35);  background: rgba(39,174,96,0.1); }
.pill.warn  { color: var(--warn); border-color: rgba(230,126,34,0.35); background: rgba(230,126,34,0.1); }
.pill.hot   { color: var(--hot);  border-color: rgba(231,76,60,0.35);  background: rgba(231,76,60,0.1);
              animation: pillAlert 0.9s ease-in-out infinite; }
.pill.cold  { color: var(--cold); border-color: rgba(41,128,185,0.35); background: rgba(41,128,185,0.1); }

@keyframes pillAlert {
  0%,100% { box-shadow: 0 0 0 0   rgba(231,76,60,0.35); }
  50%     { box-shadow: 0 0 0 7px rgba(231,76,60,0); }
}

/* ============================================================
   STATS CARD
   ============================================================ */
.stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.stat {
  background: rgba(245,200,66,0.08);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px 12px;
  text-align: center;
  transition: background 0.4s;
}
body.dark .stat { background: rgba(245,200,66,0.05); }
.stat-lbl {
  font-size: 0.6rem;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--text-soft);
  margin-bottom: 5px;
}
.stat-num {
  font-family: 'Playfair Display', serif;
  font-size: 1.85rem;
  font-weight: 700;
  line-height: 1;
  color: var(--text);
  transition: color 0.4s;
}
.stat-unit {
  font-family: 'DM Sans', sans-serif;
  font-size: 0.8rem;
  font-weight: 300;
  color: var(--text-soft);
}
.readings-note {
  margin-top: 14px;
  font-size: 0.68rem;
  color: var(--text-soft);
  font-weight: 300;
  letter-spacing: 0.05em;
  text-align: center;
}

/* ============================================================
   CHART CARD
   ============================================================ */
.chart-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  margin-bottom: 14px;
}
.chart-title {
  font-family: 'Playfair Display', serif;
  font-size: 1rem;
  font-weight: 700;
  color: var(--text);
}
.chart-meta {
  font-size: 0.65rem;
  color: var(--text-soft);
  font-weight: 300;
}
.chart-wrap {
  position: relative;
  height: 190px;
}

/* Threshold legend */
.legend {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  margin-top: 10px;
}
.leg-item {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 0.62rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-soft);
}
.leg-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

/* ============================================================
   ACTION BUTTONS
   ============================================================ */
.actions {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 22px;
  animation: fadeUp 0.65s 0.3s cubic-bezier(.16,1,.3,1) both;
}
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 11px 26px;
  border: none;
  border-radius: 12px;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
  outline: none;
}
.btn:active { transform: scale(0.97); }
.btn-reset {
  background: linear-gradient(135deg, var(--barn), var(--barn-dk));
  color: #FFE566;
  box-shadow: 0 4px 18px rgba(192,57,43,0.38);
}
.btn-reset:hover { transform: translateY(-2px); box-shadow: 0 8px 26px rgba(192,57,43,0.48); }

.btn-theme {
  background: linear-gradient(135deg, var(--hay), var(--straw));
  color: var(--soil);
  box-shadow: 0 4px 18px rgba(245,200,66,0.38);
}
.btn-theme:hover { transform: translateY(-2px); box-shadow: 0 8px 26px rgba(245,200,66,0.48); }

/* ============================================================
   LAST UPDATE
   ============================================================ */
.last-upd {
  text-align: center;
  font-size: 0.65rem;
  font-weight: 300;
  color: rgba(253,246,227,0.45);
  margin-top: 16px;
  letter-spacing: 0.08em;
}
body.dark .last-upd { color: rgba(245,200,66,0.35); }

/* ============================================================
   TOAST NOTIFICATION
   ============================================================ */
.toast {
  position: fixed;
  bottom: 28px; left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--soil);
  color: var(--hay);
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 10px 24px;
  border-radius: 999px;
  z-index: 999;
  transition: transform 0.4s cubic-bezier(.16,1,.3,1), opacity 0.4s;
  opacity: 0;
  pointer-events: none;
  border: 1px solid rgba(245,200,66,0.3);
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
</style>
</head>
<body>

<!-- ============================================================
     BACKGROUND SCENE
     ============================================================ -->
<div class="scene">
  <div class="sun"></div>
  <div class="moon"></div>
  <div class="stars" id="stars"></div>
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>

  <!-- Barn SVG -->
  <svg class="barn" width="280" height="210" viewBox="0 0 280 210" xmlns="http://www.w3.org/2000/svg">
    <polygon points="140,18 8,92 272,92" fill="#4A1A0A"/>
    <rect x="8" y="90" width="264" height="120" fill="#5C2010"/>
    <!-- cross beams -->
    <line x1="8" y1="90" x2="272" y2="210" stroke="#3A1008" stroke-width="3" opacity="0.5"/>
    <line x1="272" y1="90" x2="8" y2="210" stroke="#3A1008" stroke-width="3" opacity="0.5"/>
    <!-- door -->
    <rect x="106" y="130" width="68" height="80" rx="4" fill="#2A0A04"/>
    <path d="M106 130 Q140 108 174 130" fill="#2A0A04"/>
    <!-- windows -->
    <rect x="28" y="106" width="40" height="32" rx="4" fill="#1E0804"/>
    <line x1="48" y1="106" x2="48" y2="138" stroke="#3A1008" stroke-width="2"/>
    <line x1="28" y1="122" x2="68" y2="122" stroke="#3A1008" stroke-width="2"/>
    <rect x="212" y="106" width="40" height="32" rx="4" fill="#1E0804"/>
    <line x1="232" y1="106" x2="232" y2="138" stroke="#3A1008" stroke-width="2"/>
    <line x1="212" y1="122" x2="252" y2="122" stroke="#3A1008" stroke-width="2"/>
  </svg>

  <div class="grass"></div>
</div>

<!-- Floating feathers -->
<div class="feathers" id="feathers"></div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- ============================================================
     PAGE
     ============================================================ -->
<div class="page">
  <header>
    <div class="badge">&#127991; Live Monitoring</div>
    <h1>The Coop</h1>
    <p class="tagline">Temperature &amp; Comfort Dashboard</p>
  </header>

  <div class="grid">

    <!-- ── MAIN TEMP CARD ── -->
    <div class="card card-main">
      <div class="card-label">Current Temperature</div>

      <!-- Animated Chicken -->
      <div class="chicken-wrap">
        <svg class="chicken-svg" id="chickSvg" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">

          <!--
            ACCURATE HEN — profile view facing right
            Anatomy: tail fans left-up, body is a large oval,
            breast rounds forward-down, neck curves up to a
            round head, single-lobed comb, teardrop wattle,
            short triangular beak, round eye, two scaly legs
            with 4 toes each (3 forward 1 back = hallux).
          -->

          <!-- ══════════════════════════════════
               STATE: NORMAL — calm, happy bob
               ══════════════════════════════════ -->
          <g class="cs cs-normal active" id="cs-normal">
            <!-- ground shadow -->
            <ellipse cx="88" cy="163" rx="42" ry="7" fill="rgba(0,0,0,0.13)"/>

            <!-- TAIL FEATHERS — fan of layered quills -->
            <ellipse cx="34" cy="88" rx="10" ry="30" fill="#C8860A" transform="rotate(-55 34 88)"/>
            <ellipse cx="28" cy="82" rx="9" ry="28" fill="#D4940C" transform="rotate(-65 28 82)"/>
            <ellipse cx="24" cy="76" rx="8" ry="26" fill="#BA7A08" transform="rotate(-75 24 76)"/>
            <ellipse cx="22" cy="70" rx="7" ry="23" fill="#C88A10" transform="rotate(-85 22 70)"/>
            <!-- tail feather tips darker -->
            <ellipse cx="20" cy="60" rx="5" ry="10" fill="#7A4A04" transform="rotate(-85 20 60)"/>
            <ellipse cx="25" cy="55" rx="5" ry="10" fill="#7A4A04" transform="rotate(-72 25 55)"/>
            <ellipse cx="32" cy="54" rx="5" ry="9"  fill="#7A4A04" transform="rotate(-58 32 54)"/>

            <!-- BODY — large plump oval, slightly tilted -->
            <ellipse cx="90" cy="112" rx="52" ry="38" fill="#E8A020" transform="rotate(-8 90 112)"/>
            <!-- body shading — darker underside -->
            <ellipse cx="90" cy="128" rx="48" ry="18" fill="#C8820A" transform="rotate(-8 90 128)" opacity="0.45"/>
            <!-- body highlight -->
            <ellipse cx="82" cy="98"  rx="22" ry="14" fill="#F5C842" opacity="0.55" transform="rotate(-15 82 98)"/>

            <!-- WING — folded against body, visible as a darker layer -->
            <path d="M52,100 Q58,82 90,88 Q110,90 118,108 Q100,118 60,118 Z" fill="#C88010" opacity="0.75"/>
            <!-- wing feather lines -->
            <path d="M62,116 Q78,96 104,96" stroke="#A86808" stroke-width="1.2" fill="none" opacity="0.6"/>
            <path d="M58,112 Q74,92 100,92" stroke="#A86808" stroke-width="1.2" fill="none" opacity="0.6"/>
            <path d="M56,107 Q70,88  96,89"  stroke="#A86808" stroke-width="1.2" fill="none" opacity="0.6"/>

            <!-- NECK — slightly forward-leaning column -->
            <path d="M95,82 Q88,72 86,60 Q90,56 98,60 Q102,72 100,84 Z" fill="#E8A020"/>

            <!-- HEAD — round, sits atop neck -->

      <div class="card-label">Session Stats</div>
      <div class="stats-grid">
        <div class="stat">
          <div class="stat-lbl">Min</div>
          <div class="stat-num" id="statMin">--<span class="stat-unit">°C</span></div>
        </div>
        <div class="stat">
          <div class="stat-lbl">Max</div>
          <div class="stat-num" id="statMax">--<span class="stat-unit">°C</span></div>
        </div>
        <div class="stat">
          <div class="stat-lbl">Avg</div>
          <div class="stat-num" id="statAvg">--<span class="stat-unit">°C</span></div>
        </div>
        <div class="stat">
          <div class="stat-lbl">Readings</div>
          <div class="stat-num" id="statCount">--</div>
        </div>
      </div>
      <div class="readings-note" id="readingsNote">Waiting for data…</div>
    </div>

    <!-- ── CHART CARD ── -->
    <div class="card span2">
      <div class="chart-head">
        <div>
          <div class="chart-title">Temperature History</div>
          <div class="chart-meta">Historical readings</div>
        </div>
        <div class="legend">
          <div class="leg-item"><div class="leg-dot" style="background:#E74C3C"></div>Hot (&gt;35°C)</div>
          <div class="leg-item"><div class="leg-dot" style="background:#E67E22"></div>Warm (&gt;28°C)</div>
          <div class="leg-item"><div class="leg-dot" style="background:#27AE60"></div>Ideal</div>
          <div class="leg-item"><div class="leg-dot" style="background:#2980B9"></div>Cold (&lt;10°C)</div>
        </div>
      </div>
      <div class="chart-wrap">
        <canvas id="chartCanvas"></canvas>
      </div>
    </div>

  </div><!-- /grid -->

  <!-- Actions -->
  <div class="actions">
    <button class="btn btn-reset" onclick="resetData()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.5"/></svg>
      Reset Data
    </button>
    <button class="btn btn-theme" onclick="toggleTheme()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      Toggle Theme
    </button>
  </div>

  <div class="last-upd" id="lastUpd">Last update: —</div>
</div><!-- /page -->

<!-- ============================================================
     JAVASCRIPT
     ============================================================ -->
<script>
/* ── Stars ── */
const starsEl = document.getElementById('stars');
for (let i = 0; i < 80; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  const sz = Math.random() * 2.5 + 0.8;
  s.style.cssText = `
    left:${Math.random()*100}%;
    top:${Math.random()*65}%;
    width:${sz}px; height:${sz}px;
    --d:${2+Math.random()*4}s;
    --delay:${Math.random()*5}s;
  `;
  starsEl.appendChild(s);
}

/* ── Feathers ── */
const feathersEl = document.getElementById('feathers');
const FEATHERS = ['🪶'];
for (let i = 0; i < 14; i++) {
  const f = document.createElement('div');
  f.className = 'feather';
  f.textContent = FEATHERS[0];
  f.style.cssText = `
    left:${Math.random()*100}%;
    font-size:${0.7+Math.random()*0.8}rem;
    animation-duration:${8+Math.random()*14}s;
    animation-delay:${Math.random()*20}s;
  `;
  feathersEl.appendChild(f);
}

/* ── Chart ── */
let chartInst = null;

function buildChart(labels, temps) {
  const ctx = document.getElementById('chartCanvas').getContext('2d');
  const isDark = document.body.classList.contains('dark');
  const gridColor = isDark ? 'rgba(245,200,66,0.08)' : 'rgba(44,26,14,0.07)';
  const textColor = isDark ? 'rgba(200,160,90,0.7)' : 'rgba(122,74,34,0.8)';

  // Point colors based on temperature
  const pointColors = temps.map(t =>
    t > 35 ? '#E74C3C' : t > 28 ? '#E67E22' : t < 10 ? '#2980B9' : '#27AE60'
  );

  if (chartInst) chartInst.destroy();

  chartInst = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: 'Temperature (°C)',
        data: temps,
        borderColor: '#E8A020',
        borderWidth: 2.5,
        pointBackgroundColor: pointColors,
        pointBorderColor: 'white',
        pointBorderWidth: 1.5,
        pointRadius: 5,
        pointHoverRadius: 7,
        tension: 0.42,
        fill: true,
        backgroundColor: (ctx2) => {
          const g = ctx2.chart.ctx.createLinearGradient(0, 0, 0, ctx2.chart.height);
          g.addColorStop(0, 'rgba(232,160,32,0.25)');
          g.addColorStop(1, 'rgba(232,160,32,0.01)');
          return g;
        },
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { intersect: false, mode: 'index' },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: isDark ? '#1A1208' : '#FDF6E3',
          titleColor: isDark ? '#F5C842' : '#2C1A0E',
          bodyColor: isDark ? '#C09050' : '#7A4A22',
          borderColor: 'rgba(232,160,32,0.4)',
          borderWidth: 1,
          padding: 10,
          cornerRadius: 10,
          callbacks: {
            label: ctx2 => ` ${ctx2.parsed.y}°C`
          }
        }
      },
      scales: {
        x: {
          grid: { color: gridColor },
          ticks: { color: textColor, maxTicksLimit: 8, font: { family: 'DM Sans', size: 10 } },
          border: { display: false }
        },
        y: {
          grid: { color: gridColor },
          ticks: {
            color: textColor,
            font: { family: 'DM Sans', size: 10 },
            callback: v => v + '°'
          },
          border: { display: false }
        }
      }
    }
  });
}

/* ── State logic ── */
function getState(temp, status) {
  if (status === 'ALERT' || temp > 38 || temp < 5)  return 'alert';
  if (temp > 32)  return 'hot';
  if (temp < 12)  return 'cold';
  return 'normal';
}

function getTempClass(temp) {
  if (temp > 35) return 't-hot';
  if (temp > 28) return 't-warn';
  if (temp < 10) return 't-cold';
  return 't-good';
}

function getPillClass(state) {
  if (state === 'alert' || state === 'hot') return 'hot';
  if (state === 'cold')  return 'cold';
  if (state === 'normal') return 'good';
  return 'warn';
}

function getPillText(temp, status) {
  if (status) return status;
  if (temp > 35) return 'Too Hot!';
  if (temp > 28) return 'Warm';
  if (temp < 10) return 'Too Cold!';
  return 'Comfortable';
}

/* ── DOM refs ── */
const tempVal    = document.getElementById('tempVal');
const statusPill = document.getElementById('statusPill');
const statusText = document.getElementById('statusText');
const statMin    = document.getElementById('statMin');
const statMax    = document.getElementById('statMax');
const statAvg    = document.getElementById('statAvg');
const statCount  = document.getElementById('statCount');
const readNote   = document.getElementById('readingsNote');
const lastUpd    = document.getElementById('lastUpd');

function setChickenState(state) {
  document.querySelectorAll('.cs').forEach(el => el.classList.remove('active'));
  const el = document.getElementById('cs-' + state);
  if (el) el.classList.add('active');
}

/* ── Main update ── */
async function update() {
  try {
    const res  = await fetch('/api/status');
    const data = await res.json();

    if (data.current_temp !== null && data.current_temp !== undefined) {
      const t     = parseFloat(data.current_temp);
      const state = getState(t, data.status);

      // Temperature value
      tempVal.textContent = t.toFixed(1) + ' °C';
      tempVal.className   = 'temp-val ' + getTempClass(t);

      // Pill
      const pc = getPillClass(state);
      statusPill.className = 'pill ' + pc;
      statusText.textContent = getPillText(t, data.status);

      // Chicken
      setChickenState(state);
    }

    // Chart
    if (data.readings && data.readings.length) {
      const labels = data.readings.map(r => new Date(r.timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'}));
      const temps  = data.readings.map(r => parseFloat(r.temperature));

      buildChart(labels, temps);

      // Stats
      const min = Math.min(...temps);
      const max = Math.max(...temps);
      const avg = temps.reduce((a,b)=>a+b,0) / temps.length;

      statMin.innerHTML   = min.toFixed(1) + '<span class="stat-unit">°C</span>';
      statMax.innerHTML   = max.toFixed(1) + '<span class="stat-unit">°C</span>';
      statAvg.innerHTML   = avg.toFixed(1) + '<span class="stat-unit">°C</span>';
      statCount.textContent = temps.length;
      readNote.textContent  = temps.length + ' readings collected this session';
    }

    lastUpd.textContent = 'Last update: ' + new Date().toLocaleTimeString();
  } catch (e) {
    console.warn('API error:', e);
    lastUpd.textContent = 'Connection error — retrying…';
  }
}

/* ── Reset ── */
async function resetData() {
  try {
    await fetch('/api/reset', { method: 'POST' });
    showToast('Data cleared ✓');
    if (chartInst) { chartInst.destroy(); chartInst = null; }
    statMin.innerHTML = statMax.innerHTML = statAvg.innerHTML = '--';
    statCount.textContent = '--';
    readNote.textContent = 'Waiting for data…';
    tempVal.textContent = '-- °C';
    tempVal.className = 'temp-val';
    statusText.textContent = 'Loading…';
    setChickenState('normal');
  } catch(e) { console.warn(e); }
}

/* ── Theme ── */
function toggleTheme() {
  document.body.classList.toggle('dark');
  showToast(document.body.classList.contains('dark') ? '🌙 Night mode' : '☀️ Day mode');
  // Rebuild chart for correct colors
  if (chartInst) {
    const labels = chartInst.data.labels;
    const temps  = chartInst.data.datasets[0].data;
    buildChart(labels, temps);
  }
}

/* ── Toast ── */
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

/* ── Boot ── */
update();
</script>
</body>
</html>
